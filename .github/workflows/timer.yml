name: Planner timer

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: planner-timer
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/timer.yml/enable" || true

      - name: Wake the planner once a minute for 25 minutes
        env:
          TIMER_URL: ${{ secrets.PLANNER_TIMER_URL }}
        run: |
          if [ -z "$TIMER_URL" ]; then
            echo "Add the PLANNER_TIMER_URL secret first."
            exit 1
          fi
          for i in $(seq 1 25); do
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$TIMER_URL" || true)
            echo "$(date -u +%H:%M:%S) planner answered $code"
            sleep 60
          done
